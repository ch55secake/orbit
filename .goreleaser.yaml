version: 2

project_name: orbit

before:
  hooks:
    - go mod tidy

builds:
  - id: orbit
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
