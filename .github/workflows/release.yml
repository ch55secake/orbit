name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ch55secake/cheesecake-factory/.github/workflows/release.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      binary-name: orbit
      build-package: ./cmd/orbit
      cgo-enabled: '0'
      ldflags: -s -w -X main.version={{.Version}}
      go-version-file: go.mod
      targets: '[{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"},{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"}]'
